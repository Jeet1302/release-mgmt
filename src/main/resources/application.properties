spring.application.name=customer-notifications
server.port=8080

# Demo configuration for asynchronous customer notification delivery.
notification.delivery.timeout=4s
notification.delivery.max-retries=3
notification.topic.name=customer-notifications

# NotificationService publishes created notifications to this Kafka topic.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
